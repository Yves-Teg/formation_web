<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLaboratoire Flex</title>
    <link rel="stylesheet" href="laboratoire-flex.css">
</head>

<body>

    <h1>Laboratoire Flexbox</h1>

    <h2>1. flex-direction: row</h2>

    <div class="conteneur row">
        <div class="boite">1</div>
        <div class="boite">2</div>
        <div class="boite">3</div>
        <div class="boite">4</div>
        <div class="boite">5</div>
    </div>


    <h2>2. flex-direction: column</h2>

    <div class="conteneur column">
        <div class="boite">1</div>
        <div class="boite">2</div>
        <div class="boite">3</div>
        <div class="boite">4</div>
        <div class="boite">5</div>
    </div>


    <h2>3. justify-content: space-between</h2>

    <div class="conteneur space-between">
        <div class="boite">1</div>
        <div class="boite">2</div>
        <div class="boite">3</div>
        <div class="boite">4</div>
        <div class="boite">5</div>
    </div>


    <h2>4. justify-content: center</h2>

    <div class="conteneur center">
        <div class="boite">1</div>
        <div class="boite">2</div>
        <div class="boite">3</div>
        <div class="boite">4</div>
        <div class="boite">5</div>
    </div>


    <h2>5. align-items: center</h2>

    <div class="conteneur alignement">
        <div class="boite petite">1</div>
        <div class="boite grande">2</div>
        <div class="boite moyenne">3</div>
        <div class="boite grande">4</div>
        <div class="boite petite">5</div>
    </div>


    <h2>6. flex-wrap: wrap</h2>

    <div class="conteneur wrap">
        <div class="boite">1</div>
        <div class="boite">2</div>
        <div class="boite">3</div>
        <div class="boite">4</div>
        <div class="boite">5</div>
    </div>

</body>

</html>
