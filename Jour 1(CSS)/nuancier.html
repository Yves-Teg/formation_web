<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuancier CSS</title>

    <style>
        .boite{
            width: 200px;
            height: 100px;
            margin: 30px;
        }

        .nom{
            background-color: red;
        }

        .rgb{
            background-color: rgb(255, 0, 0);
        }

        .hexa{
            background-color: #ff0000;
        }
    </style>
</head>

<body>

    <h1>Les trois ecritures d'une meme couleur</h1>
    <div class="boite nom"></div>
    <div class="boite rgb"></div>
    <div class="boite hexa"></div>

</body>

</html>
