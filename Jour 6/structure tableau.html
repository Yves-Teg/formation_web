<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemple de Tableau HTML Structuré</title>
</head>
<body>

    <table border="1">
        <caption>Rapport des ventes mensuelles</caption>
        
        <thead>
            <tr>
                <th scope="col">Produit</th>
                <th scope="col">Région</th>
                <th scope="col">Ventes</th>
            </tr>
        </thead>
        
        <tbody>
            <tr>
                <th scope="row" rowspan="2">Téléphones</th>
                <td>Nord</td>
                <td>500 €</td>
            </tr>
            <tr>
                <td>Sud</td>
                <td>450 €</td>
            </tr>
            <tr>
                <th scope="row">Ordinateurs</th>
                <td>Nord</td>
                <td>1 200 €</td>
            </tr>
        </tbody>
        
        <tfoot>
            <tr>
                <th scope="row" colspan="2">Total Général</th>
                <td>2 150 €</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
