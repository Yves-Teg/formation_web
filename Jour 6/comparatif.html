<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Comparatif HTML/CSS/JS</title>
  </head>
  <body>
    <main>
      <h1>Comparatif HTML / CSS / JS</h1>

      <table border="1">
        <caption>Rôle de chaque langage du web</caption>
        <thead>
          <tr>
            <th scope="col">Langage</th>
            <th scope="col">Rôle</th>
            <th scope="col">Type</th>
            <th scope="col">Exemple d'usage</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">HTML</th>
            <td>Structure</td>
            <td>Déclaratif</td>
            <td>Créer un titre avec &lt;h1&gt;</td>
          </tr>
          <tr>
            <th scope="row">CSS</th>
            <td>Apparence</td>
            <td>Déclaratif</td>
            <td>Changer la couleur d'un bouton</td>
          </tr>
          <tr>
            <th scope="row">JS</th>
            <td>Comportement</td>
            <td>Programmation</td>
            <td>Afficher une popup au clic</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
