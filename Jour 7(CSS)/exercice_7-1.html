<!DOCTYPE html>
<html lang="fr">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premieres briques Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>

    <!-- text-center : text-align: center -->
    <!-- text-3xl : font-size: 1.875rem -->
    <!-- font-bold : font-weight: 700 -->
    <h1 class="text-center text-3xl font-bold">Bienvenue</h1>

    <!-- text-gray-600 : color: #4b5563 -->
    <!-- leading-relaxed : line-height: 1.625 -->
    <p class="text-gray-600 leading-relaxed">
      Ce paragraphe est style uniquement avec des classes utilitaires Tailwind,
      sans ecrire la moindre ligne de CSS personnalise.
    </p>

    <!-- bg-amber-100 : background-color: #fef3c7 -->
    <!-- p-4 : padding: 1rem (tous cotes) -->
    <!-- rounded-lg : border-radius: 0.5rem -->
    <div class="bg-amber-100 p-4 rounded-lg">
      Boite a fond colore, padding et coins arrondis.
    </div>

  </body>

</html>
