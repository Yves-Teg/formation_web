<!DOCTYPE html>
<html lang="fr">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <main class="max-w-xl mx-auto p-8">
      <h1 class="text-2xl font-bold text-indigo-700 mb-6">Contact</h1>

      <form>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label for="prenom" class="block font-medium mb-1">Prenom</label>
            <input type="text" id="prenom" name="prenom" required class="w-full border rounded px-3 py-2 focus:ring-2 focus:border-indigo-600">
          </div>

          <div>
            <label for="nom" class="block font-medium mb-1">Nom</label>
            <input type="text" id="nom" name="nom" required class="w-full border rounded px-3 py-2 focus:ring-2 focus:border-indigo-600">
          </div>
        </div>

        <div class="mb-4">
          <label for="email" class="block font-medium mb-1">Email</label>
          <input type="email" id="email" name="email" required class="w-full border rounded px-3 py-2 focus:ring-2 focus:border-indigo-600">
        </div>

        <div class="mb-4">
          <label for="message" class="block font-medium mb-1">Message</label>
          <textarea id="message" name="message" required minlength="10" class="w-full border rounded px-3 py-2 focus:ring-2 focus:border-indigo-600"></textarea>
        </div>

        <button type="submit" class="bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 focus:ring-2 transition">
          Envoyer
        </button>

      </form>

    </main>

  </body>

</html>
