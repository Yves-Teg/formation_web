<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Galerie images</title>
        <link rel="stylesheet" href="galerie.css">
    </head>

    <body>

        <h1>Galerie d'images</h1>

        <main>

            <div class="galerie">

                 <!-- Photo d'un ours brun se reposant sur une structure en beton -->
                <figure class="figure-galerie">
                    <a href="https://www.pexels.com/fr-fr/photo/ours-brun-detendu-se-reposant-sur-une-structure-en-beton-31791315/" target="_blank">
                        <img src="Images/0urs brun.jpg" alt="Ours brun se reposant sur une structure en beton" width="300">
                    </a>
                    <figcaption>Un Ours brun au repos</figcaption>
                </figure>

                <!-- Photo d'un chien noir portant un collier en jean bleu -->
                <figure class="figure-galerie">
                    <a href="https://unsplash.com/fr/photos/chien-noir-portant-un-collier-en-jean-bleu-K4mSJ7kc0As" target="_blank">
                        <img src="Images/Chien.jpg" alt="chien noir portant un collier en jean bleu" width="300">
                    </a>
                    <figcaption>Chien noir aux grands yeux vetus en chemise jean et portant un collier</figcaption>
                </figure>    

                <!-- Photo d'une petite souris assise sur un bloc de ciment -->
                <figure class="figure-galerie">
                    <a href="https://unsplash.com/fr/photos/une-petite-souris-assise-sur-un-bloc-de-ciment--MGo5XlSdXA" target="_blank">
                        <img src="Images/Souris.jpg" alt="une petite souris assise sur un bloc de ciment" width="300">
                    </a>
                    <figcaption>Souris assise sur un bloc de ciment</figcaption>
                </figure>

                <!-- Photo d'un tigre brun marchant sur le sable brun pendant la journee -->
                <figure class="figure-galerie">
                    <a href="https://unsplash.com/fr/photos/tigre-brun-marchant-sur-le-sable-brun-pendant-la-journee-Fbdr6gXJBVY" target="_blank">
                        <img src="Images/Tigre.jpg" alt="tigre brun marchant sur le sable brun pendant la journee" width="300">
                    </a>
                    <figcaption>Tigre brun marchant sur sable</figcaption>
                </figure>

            </div>

        </main>

    </body>

</html>
