<!DOCTYPE html>
<html lang="fr">
  <head>

    <title>Detournement de Google</title>
  </head>
  <body>
    <main>
      <h1>Mon faux moteur de recherche</h1>

      <form action="https://www.google.com/search">
        <label for="recherche">Recherche</label>
        <input type="text" id="recherche" name="q">
        <label for="extra">champ supplemetaire</label>
        <input type="text" id="extra">
        <button type="submit">Rechercher</button>
      </form>
      <form action="https://www.reddit.com/search/">
        <label for="recherche-reddit">Recherche Reddit</label>
        <input type="text" id="recherche-reddit" name="q" />
        <button type="submit">Rechercher sur Reddit</button>
      </form>
    </main>
  </body>
