<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscription au Marathon</title>
</head>

<body>

    <header>
        <h1>Inscription au Marathon</h1>

        <p>
            Remplissez le formulaire ci-dessous pour participer au marathon.
        </p>
    </header>

    <main>

        <form action="#" method="post">

            <fieldset>
                <legend>Identite</legend>

                <div>
                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" name="nom" required autocomplete="family-name">
                </div>

                <div>
                    <label for="prenom">Prenom :</label>
                    <input type="text" id="prenom" name="prenom" required autocomplete="given-name">
                </div>

                <div>
                    <label for="email">Adresse e-mail :</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>

                <div>
                    <label for="date-naissance">Date de naissance :</label>
                    <input type="date" id="date-naissance" name="date_naissance" required>
                </div>

            </fieldset>

            <fieldset>
                <legend>Taille du T-shirt</legend>

                <label for="taille">Choisissez votre taille :</label>

                <select id="taille" name="taille" required>
                    <option value="">Selectionnez une taille</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                    <option value="XXL">XXL</option>
                </select>

            </fieldset>

            <fieldset>
                <legend>Distance choisie</legend>

                <div>
                    <input type="radio" id="10km" name="distance" value="10km" required>
                    <label for="10km">10 km</label>
                </div>

                <div>
                    <input type="radio" id="semi" name="distance" value="semi-marathon">
                    <label for="semi">Semi-marathon</label>
                </div>

                <div>
                    <input type="radio" id="marathon" name="distance" value="marathon">
                    <label for="marathon">Marathon</label>
                </div>

            </fieldset>

            <fieldset>
                <legend>Reglement</legend>

                <div>
                    <input type="checkbox" id="reglement" name="reglement" value="accepte" required>
                    <label for="reglement">J'accepte le reglement du marathon.</label>
                </div>
            </fieldset>

            <button type="submit">S'inscrire</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Marathon - Tous droits reserves.</p>
    </footer>

</body>

</html>
